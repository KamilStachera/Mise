x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 512m
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mise_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-mise}
    volumes:
      - mise-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mise} -d ${POSTGRES_DB:-mise}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    mem_limit: 1g
    logging: *default-logging
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: ${ConnectionStrings__Default:-Host=db;Port=5432;Database=mise;Username=mise;Password=mise_dev_password}
      ContextDir: /context
      ImagesDir: /data/images
      # Host-side path of ./context + API base, used to render ready-made agent prompts.
      HOST_CONTEXT_DIR: ${HOST_CONTEXT_DIR:-}
      PUBLIC_API_BASE: ${PUBLIC_API_BASE:-http://localhost:5080/api}
      AI_PROVIDER: ${AI_PROVIDER:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      SOUS_URL: http://sous:8090
      SOUS_SECRET: ${SOUS_SECRET:-}
      # Background Polish descriptions + YouTube demos for the exercise catalog (AI_PROVIDER=codex).
      EXERCISE_ENRICH: ${EXERCISE_ENRICH:-on}
      EXERCISE_ENRICH_INTERVAL: ${EXERCISE_ENRICH_INTERVAL:-60}
      EXERCISE_ENRICH_BATCH: ${EXERCISE_ENRICH_BATCH:-6}
      # Households: members sign in with Google; new accounts join with an invite code.
      # Agents use personal API keys; Sous gets short-lived per-turn tokens minted by the API.
      Auth__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Auth__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Auth__AdminEmails: ${ADMIN_EMAILS:-}
      Auth__PublicHouseholdId: ${PUBLIC_HOUSEHOLD_ID:-}
      MISE_API_KEY: ${MISE_API_KEY:-}
      Auth__DevBypass: ${AUTH_DEV_BYPASS:-false}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
      # Legacy single-household config, imported once into household 1 on boot (safe to
      # remove after the first boot of the households version).
      Auth__AllowedEmails: ${AUTH_ALLOWED_EMAILS:-}
      Diary__People: ${DIARY_PEOPLE:-}
      KeysDir: /data/keys
      # Watch workouts via Strava (README "Strava"). Empty = off. The webhook registers itself
      # at {PUBLIC_API_BASE}/strava/webhook when that base is https.
      Strava__ClientId: ${STRAVA_CLIENT_ID:-}
      Strava__ClientSecret: ${STRAVA_CLIENT_SECRET:-}
      # "Today" for the plan/diary and the day a band sample belongs to are Polish days.
      TZ: Europe/Warsaw
    volumes:
      # Shared with the host so you can open it with Codex / Claude Code.
      - ./context:/context
      - mise-images:/data/images
      # DataProtection keys — without persistence every rebuild would log
      # everyone out and break in-flight Google logins and Strava tokens.
      - mise-keys:/data/keys
    ports:
      # Direct access for local agents/Swagger. Writes are auth-gated in the app
      # itself (middleware), but keep the raw port loopback-only anyway.
      - "127.0.0.1:5080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /api/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    mem_limit: 128m
    logging: *default-logging
    ports:
      # On a public host (VPS) set WEB_BIND=127.0.0.1:8080 in .env so nginx is
      # loopback-only — cloudflared reaches it over the compose network,
      # nothing else should. Default keeps LAN access for home use.
      - "${WEB_BIND:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      api:
        condition: service_healthy

  # In-app Sous on Codex, signed in with the household's ChatGPT plan (AI_PROVIDER=codex).
  # One-time login: docker compose exec sous codex login --device-auth
  # Internal only: no ports — the api container is the only caller (authenticated via X-Sous-Secret)
  # and issues short-lived per-turn household-scoped tokens. No /context mount.
  sous:
    build:
      context: .
      dockerfile: sous/Dockerfile
    restart: unless-stopped
    mem_limit: 1g
    logging: *default-logging
    environment:
      MISE_API_URL: http://api:8080
      SOUS_SECRET: ${SOUS_SECRET:-}
      # Fallback only when SOUS_SECRET is unset (used solely to derive the same X-Sous-Secret hash, never sent to the API).
      MISE_API_KEY: ${MISE_API_KEY:-}
      SOUS_MODEL: ${SOUS_MODEL:-}
      SOUS_REASONING: ${SOUS_REASONING:-low}
      SOUS_JOB_WEB_SEARCH: ${SOUS_JOB_WEB_SEARCH:-live}
      SOUS_JOB_REASONING: ${SOUS_JOB_REASONING:-low}
      TZ: Europe/Warsaw
    volumes:
      # ChatGPT sign-in (auth.json) and the conversation threads.
      - sous-codex:/data/codex
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
    depends_on:
      api:
        condition: service_healthy

  # Public exposure via Cloudflare Tunnel (TLS + domain, no open inbound ports).
  # Opt-in: docker compose --profile public up -d --build
  # Ingress is configured in the Cloudflare Zero Trust dashboard:
  #   https://<your-domain> -> http://web:80
  cloudflared:
    image: cloudflare/cloudflared:2026.3.0
    restart: unless-stopped
    mem_limit: 256m
    logging: *default-logging
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    profiles: ["public"]
    depends_on:
      web:
        condition: service_healthy

volumes:
  mise-db:
  mise-images:
  mise-keys:
  sous-codex:
