<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pichci — Książka kucharska AI</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f5f0e6" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Apply the saved look before first paint (no flash of the default theme). Mirrors
      // src/lib/theme.ts — same storage key and attributes.
      try {
        var t = JSON.parse(localStorage.getItem('pichci:theme') || 'null')
        if (t && (t.theme === 'night' || t.theme === 'rose')) {
          document.documentElement.setAttribute('data-theme', t.theme)
          if (t.roseBg) document.documentElement.setAttribute('data-rose-bg', t.roseBg)
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
