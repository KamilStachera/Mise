# Behind Cloudflare Tunnel nginx listens on plain :80, so $scheme would say
# "http" and the backend would mint http:// OAuth redirect URIs (Google rejects
# them) and non-Secure cookies. Trust the proto cloudflared already forwarded;
# fall back to $scheme for direct LAN/localhost access.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy the API (single origin, no CORS needed in production).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        # $http_host keeps the port (localhost:8080) — $host would strip it and
        # break the OAuth redirect_uri for non-standard-port access.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        client_max_body_size 6m;
        
        # Server-Sent Events (in-app chat streaming): disable buffering.
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Vite content-hashes everything here, so a deploy never reuses a name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback. no-cache = revalidate every load: without it browsers guess a
    # freshness window from Last-Modified and the installed PWA keeps booting the
    # previous deploy's index.html (and its old bundle).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
